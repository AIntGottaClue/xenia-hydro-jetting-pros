name: Publish preview-only fixes
on:
  push:
    branches: [preview-fixes]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: preview-fixes-pages
  cancel-in-progress: false
jobs:
  preview:
    if: github.ref == 'refs/heads/preview-fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview-fixes
          fetch-depth: 0
      - name: Apply audited preview source patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/preview-fixes.patch <<'PATCH'
          diff --git a/src/components/Hero.astro b/src/components/Hero.astro
          index ae661c3..a3fd27e 100644
          --- a/src/components/Hero.astro
          +++ b/src/components/Hero.astro
          @@ -18,7 +18,6 @@ const relevantImage = pageImage(headline);
                 <h1>{headline}</h1>
                 <p class="hero-copy">{intro}</p><div class="hero-cta"><a href={business.phoneHref}>{business.phoneDisplay}</a><a href="#request-service">Request a call</a></div>
                 {!['Privacy','Terms'].includes(location) && <img src={u(relevantImage.src)} alt={relevantImage.alt} width="1200" height="896" loading="eager" decoding="async" fetchpriority="high" style="display:block;width:100%;max-width:520px;height:clamp(190px,22vw,280px);object-fit:cover;border-radius:4px;margin:24px 0 0" />}
          -      <p class="image-note">Illustrative image, not a photo of a local job.</p>
               </div>
               <RequestForm location={location} />
             </div>
          PATCH
          if git apply --check /tmp/preview-fixes.patch; then
            git apply /tmp/preview-fixes.patch
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src
            git commit -m 'Remove preview image disclaimers and update service cards'
            git push origin HEAD:preview-fixes
          elif git apply --reverse --check /tmp/preview-fixes.patch; then
            echo 'Preview source patch already applied.'
          else
            echo 'Preview patch no longer matches source. Review required.' >&2
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE: /xenia-hydro-jetting-pros
          SITE_BASE: /xenia-hydro-jetting-pros
      - name: Publish only GitHub Pages preview
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
